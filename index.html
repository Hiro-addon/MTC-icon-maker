
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTC Model 3D Viewer</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#101318;
  color:#eef2f7;
  font-family:system-ui,-apple-system,sans-serif
}
header{
  padding:14px 16px;
  background:#1b222c;
  font-weight:700
}
main{
  padding:14px;
  max-width:900px;
  margin:auto
}
.panel{
  background:#1b222c;
  border:1px solid #303b49;
  border-radius:12px;
  padding:14px;
  margin-bottom:12px
}
label{
  display:block;
  font-size:14px;
  margin:8px 0 5px;
  color:#c7d0dc
}
input{
  width:100%;
  padding:10px;
  background:#111820;
  color:#fff;
  border:1px solid #465466;
  border-radius:8px
}
button{
  border:0;
  border-radius:9px;
  background:#4b83e6;
  color:white;
  padding:12px 16px;
  font-weight:700;
  width:100%;
  margin-top:12px
}
#view{
  width:100%;
  height:min(65vh,560px);
  min-height:380px;
  display:block;
  background:#dce3ea;
  border-radius:10px;
  touch-action:none
}
small{
  color:#aab6c5;
  line-height:1.6;
  display:block;
  margin-top:8px
}
#status{
  font-size:13px;
  color:#b9c8d9;
  margin-top:8px;
  overflow-wrap:anywhere
}
</style>
</head>

<body>

<header>MTC 車両モデル・3Dビューア</header>

<main>

<div class="panel">

<label>Bedrock geometry JSON</label>
<input id="json" type="file" accept=".json,application/json">

<label>テクスチャ PNG</label>
<input id="png" type="file" accept="image/png">

<button id="draw">3Dモデルを読み込む</button>

<div id="status">
JSONとPNGを選択してください。
</div>

<small>
ドラッグ：モデル回転<br>
ピンチ：拡大・縮小<br>
マウスホイール：拡大・縮小<br>
アニメーションなし
</small>

</div>

<div class="panel">
<canvas id="view"></canvas>
</div>

</main>

<script type="module">

import * as THREE from 'three';

import { OrbitControls } from
'three/addons/controls/OrbitControls.js';

const $=id=>document.getElementById(id);
const canvas=$('view');

let renderer,scene,camera,controls;
let modelRoot;
let animationId;

function setStatus(s){
  $('status').textContent=s;
}

function rad(v){
  return v*Math.PI/180;
}

/* ==================================================
   元の正常な描画処理：UV変換
================================================== */

function uvRect(face, tw, th){
  if(!face || !face.uv || !face.uv_size) return null;

  const [u,v]=face.uv;
  const [w,h]=face.uv_size;

  return [
    u/tw,
    1-v/th,
    (u+w)/tw,
    1-(v+h)/th
  ];
}

/* ==================================================
   元の正常な描画処理：キューブ生成
================================================== */

function buildCube(cube,boneGroup,texture,tw,th,bonePivot){

  let [sx,sy,sz]=cube.size;

  const eps=0.001;

  const geom=new THREE.BoxGeometry(
    Math.max(sx,eps),
    Math.max(sy,eps),
    Math.max(sz,eps)
  ).toNonIndexed();

  const pos=cube.origin.map(
    (v,i)=>v+cube.size[i]/2
  );

  const faces=[
    'east',
    'west',
    'up',
    'down',
    'south',
    'north'
  ];

  const groups=geom.groups;
  const uv=geom.attributes.uv;

  // BoxGeometry groups correspond to +X,-X,+Y,-Y,+Z,-Z
  faces.forEach((name,idx)=>{

    const rect=uvRect(
      cube.uv?.[name],
      tw,
      th
    );

    if(!rect) return;

    const group=groups[idx];

    if(!group) return;

    const [u0,v0,u1,v1]=rect;

    for(
      let j=group.start;
      j<group.start+group.count;
      j++
    ){

      const oldU=uv.getX(j);
      const oldV=uv.getY(j);

      // 元のUV変換処理
      uv.setXY(
        j,
        u0+(u1-u0)*oldU,
        v1+(v0-v1)*oldV
      );
    }
  });

  uv.needsUpdate=true;

  const mat=new THREE.MeshBasicMaterial({
    map:texture,
    transparent:true,
    side:THREE.DoubleSide
  });

  const mesh=new THREE.Mesh(geom,mat);

  const bp=bonePivot||[0,0,0];

  mesh.position.set(
    pos[0]-bp[0],
    pos[1]-bp[1],
    pos[2]-bp[2]
  );

  if(cube.pivot){

    const p=cube.pivot;

    const wrapper=new THREE.Group();

    wrapper.position.set(
      p[0]-bp[0],
      p[1]-bp[1],
      p[2]-bp[2]
    );

    mesh.position.set(
      pos[0]-p[0],
      pos[1]-p[1],
      pos[2]-p[2]
    );

    if(cube.rotation){
      wrapper.rotation.set(
        ...cube.rotation.map(rad),
        'ZYX'
      );
    }

    wrapper.add(mesh);
    boneGroup.add(wrapper);

  }else{

    boneGroup.add(mesh);

  }
}

/* ==================================================
   元の正常な描画処理：モデル読み込み
================================================== */

function loadModel(data,texture){

  const geo=data['minecraft:geometry']?.[0];

  if(!geo){
    throw Error('minecraft:geometry が見つかりません');
  }

  const tw=
    geo.description.texture_width||
    texture.image.width;

  const th=
    geo.description.texture_height||
    texture.image.height;

  const root=new THREE.Group();
  const map=new Map();

  for(const b of geo.bones){

    const group=new THREE.Group();

    group.name=b.name;

    const pivot=b.pivot||[0,0,0];

    group.userData.pivot=pivot;

    if(b.rotation){

      group.rotation.set(
        ...b.rotation.map(rad),
        'ZYX'
      );

    }

    map.set(b.name,{
      group,
      b
    });
  }

  for(const b of geo.bones){

    const item=map.get(b.name);

    if(b.parent && map.has(b.parent)){

      const parent=map.get(b.parent).group;

      const pp=parent.userData.pivot||[0,0,0];
      const cp=item.group.userData.pivot||[0,0,0];

      item.group.position.set(
        cp[0]-pp[0],
        cp[1]-pp[1],
        cp[2]-pp[2]
      );

      parent.add(item.group);

    }else{

      const cp=item.group.userData.pivot||[0,0,0];

      item.group.position.set(...cp);

      root.add(item.group);

    }

    for(const cube of b.cubes||[]){

      buildCube(
        cube,
        item.group,
        texture,
        tw,
        th,
        item.group.userData.pivot
      );

    }
  }

  return {
    root,
    desc:geo.description
  };
}

/* ==================================================
   ここから3D表示用の追加処理
================================================== */

function setup3D(root){

  if(animationId){
    cancelAnimationFrame(animationId);
    animationId=null;
  }

  if(controls){
    controls.dispose();
    controls=null;
  }

  if(renderer){
    renderer.dispose();
  }

  const w=Math.max(320,canvas.clientWidth);
  const h=Math.max(300,canvas.clientHeight);

  renderer=new THREE.WebGLRenderer({
    canvas,
    antialias:true,
    alpha:false,
    preserveDrawingBuffer:true
  });

  renderer.setPixelRatio(
    Math.min(devicePixelRatio||1,2)
  );

  renderer.setSize(w,h,false);

  renderer.setClearColor(0xe2e8ef,1);

  scene=new THREE.Scene();

  scene.background=new THREE.Color(0xe2e8ef);

  scene.add(root);

  root.updateMatrixWorld(true);

  const box=new THREE.Box3().setFromObject(root);

  if(box.isEmpty()){
    throw Error('モデルに表示できる立体がありません');
  }

  const center=box.getCenter(
    new THREE.Vector3()
  );

  const size=box.getSize(
    new THREE.Vector3()
  );

  const maxSize=Math.max(
    size.x,
    size.y,
    size.z
  );

  const aspect=w/h;

  camera=new THREE.PerspectiveCamera(
    45,
    aspect,
    0.1,
    Math.max(10000,maxSize*100)
  );

  // 最初は車両の先頭側（Zマイナス方向）から表示
  const fov=THREE.MathUtils.degToRad(camera.fov);

  const distance=
    (maxSize/2)/Math.tan(fov/2)*1.8;

  camera.position.set(
    center.x,
    center.y,
    center.z-distance
  );

  camera.up.set(0,1,0);
  camera.lookAt(center);

  controls=new OrbitControls(
    camera,
    canvas
  );

  controls.target.copy(center);

  controls.enableDamping=true;
  controls.dampingFactor=0.07;

  controls.enableZoom=true;
  controls.enableRotate=true;
  controls.enablePan=true;

  controls.minDistance=Math.max(0.1,maxSize*0.01);
  controls.maxDistance=maxSize*30;

  controls.update();

  return {center,size};
}

/* ==================================================
   描画ループ
================================================== */

function animate(){

  animationId=requestAnimationFrame(animate);

  if(controls){
    controls.update();
  }

  if(renderer && scene && camera){
    renderer.render(scene,camera);
  }
}

/* ==================================================
   JSON・PNG読み込み
================================================== */

$('draw').addEventListener('click',async()=>{

  try{

    const jf=$('json').files[0];
    const pf=$('png').files[0];

    if(!jf||!pf){
      throw Error(
        'JSONとPNGの両方を選択してください'
      );
    }

    setStatus('読み込み中…');

    const data=JSON.parse(
      await jf.text()
    );

    const bitmap=await createImageBitmap(pf);

    // 元の正常なテクスチャ設定を維持
    const tex=new THREE.CanvasTexture(bitmap);

    tex.colorSpace=THREE.SRGBColorSpace;
    tex.magFilter=THREE.NearestFilter;
    tex.minFilter=THREE.NearestFilter;
    tex.flipY=false;

    const {root,desc}=loadModel(data,tex);

    modelRoot=root;

    const result=setup3D(root);

    animate();

    setStatus(
      `表示完了：${desc.identifier||'Bedrock model'} / ボーン ${data['minecraft:geometry'][0].bones.length}個`
    );

  }catch(e){

    setStatus('エラー：'+e.message);

    console.error(e);

  }

});

/* ==================================================
   画面サイズ変更
================================================== */

window.addEventListener('resize',()=>{

  if(!renderer||!camera) return;

  const w=Math.max(320,canvas.clientWidth);
  const h=Math.max(300,canvas.clientHeight);

  camera.aspect=w/h;
  camera.updateProjectionMatrix();

  renderer.setSize(w,h,false);

});

</script>
</body>
</html>
