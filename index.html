
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTC 車両 3Dモデルビューア</title>

<!-- Three.js の読み込み先を指定 -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #10151d;
  color: #f4f6fa;
  font-family: system-ui, sans-serif;
}

header {
  padding: 15px 18px;
  background: #1c2633;
  font-weight: 700;
  font-size: 19px;
}

main {
  max-width: 1000px;
  margin: auto;
  padding: 14px;
}

.panel {
  background: #1c2633;
  padding: 14px;
  border-radius: 13px;
  margin-bottom: 14px;
}

label {
  display: block;
  margin: 10px 0 6px;
}

input {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #526174;
  background: #101820;
  color: white;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border: 0;
  border-radius: 9px;
  background: #4b83e6;
  color: white;
  font-weight: 700;
  font-size: 15px;
}

#viewer {
  width: 100%;
  height: 65vh;
  min-height: 380px;
  background: #dce3ea;
  border-radius: 10px;
  overflow: hidden;
  touch-action: none;
}

#status {
  font-size: 13px;
  color: #c7d2e0;
  margin-top: 10px;
  overflow-wrap: anywhere;
}

small {
  color: #aebaca;
}

</style>
</head>

<body>

<header>MTC 車両 3Dモデルビューア</header>

<main>

<div class="panel">

<label>Geometry JSON</label>
<input
  id="json"
  type="file"
  accept=".json,application/json"
>

<label>Texture PNG</label>
<input
  id="png"
  type="file"
  accept="image/png"
>

<button id="load">3Dモデルを表示</button>

<div id="status">
JSONとPNGを選択してください。
</div>

<br>

<small>
ドラッグ：回転<br>
ピンチ：拡大・縮小<br>
マウスホイール：拡大・縮小
</small>

</div>

<div class="panel">
  <div id="viewer"></div>
</div>

</main>

<script type="module">

import * as THREE from 'three';

import { OrbitControls } from
'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);

let renderer;
let scene;
let camera;
let controls;
let modelRoot;
let animationId;

const say = text => {
  $('status').textContent = text;
};

const rad = n => n * Math.PI / 180;

function applyRotation(obj, rotation) {
  if (!rotation) return;

  obj.rotation.order = 'ZYX';

  obj.rotation.set(
    rad(-rotation[0]),
    rad(-rotation[1]),
    rad(rotation[2])
  );
}

/* UV座標 */
function getUV(face, defaultSize, tw, th) {

  const p = face.uv || [0, 0];
  const sz = face.uv_size || defaultSize;

  let points = [
    [p[0], p[1]],
    [p[0] + sz[0], p[1]],
    [p[0] + sz[0], p[1] + sz[1]],
    [p[0], p[1] + sz[1]]
  ];

  const turns =
    (((face.uv_rotation || 0) / 90) % 4 + 4) % 4;

  for (let i = 0; i < turns; i++) {
    points = [
      points[3],
      points[0],
      points[1],
      points[2]
    ];
  }

  return points.map(v => [
    v[0] / tw,
    1 - v[1] / th
  ]);
}

/* 立方体の各面 */
function faceVertices(x0, y0, z0, x1, y1, z1) {

  return {

    north: [
      [x0, y1, z0],
      [x1, y1, z0],
      [x1, y0, z0],
      [x0, y0, z0]
    ],

    south: [
      [x1, y1, z1],
      [x0, y1, z1],
      [x0, y0, z1],
      [x1, y0, z1]
    ],

    east: [
      [x1, y1, z0],
      [x1, y1, z1],
      [x1, y0, z1],
      [x1, y0, z0]
    ],

    west: [
      [x0, y1, z1],
      [x0, y1, z0],
      [x0, y0, z0],
      [x0, y0, z1]
    ],

    up: [
      [x0, y1, z0],
      [x1, y1, z0],
      [x1, y1, z1],
      [x0, y1, z1]
    ],

    down: [
      [x1, y0, z0],
      [x0, y0, z0],
      [x0, y0, z1],
      [x1, y0, z1]
    ]

  };
}

function faceDimensions(name, size) {

  if (name === 'north' || name === 'south') {
    return [size[0], size[1]];
  }

  if (name === 'east' || name === 'west') {
    return [size[2], size[1]];
  }

  return [size[0], size[2]];
}

/* キューブ作成 */
function makeCube(c, tw, th, bonePivot, material) {

  const o = c.origin;
  const s = c.size;
  const inf = c.inflate || 0;

  const x0 = o[0] - inf;
  const y0 = o[1] - inf;
  const z0 = o[2] - inf;

  const x1 = o[0] + s[0] + inf;
  const y1 = o[1] + s[1] + inf;
  const z1 = o[2] + s[2] + inf;

  const verts = faceVertices(
    x0, y0, z0,
    x1, y1, z1
  );

  const positions = [];
  const uvs = [];
  const indices = [];

  for (const name of [
    'north',
    'south',
    'east',
    'west',
    'up',
    'down'
  ]) {

    const face = c.uv?.[name];

    if (!face) continue;

    const vertices = verts[name];

    const dimensions = faceDimensions(name, [
      x1 - x0,
      y1 - y0,
      z1 - z0
    ]);

    if (
      Math.abs(dimensions[0]) < 1e-10 ||
      Math.abs(dimensions[1]) < 1e-10
    ) {
      continue;
    }

    const faceUV = getUV(
      face,
      dimensions,
      tw,
      th
    );

    const base = positions.length / 3;

    for (let i = 0; i < 4; i++) {
      positions.push(...vertices[i]);
      uvs.push(...faceUV[i]);
    }

    indices.push(
      base,
      base + 1,
      base + 2,
      base,
      base + 2,
      base + 3
    );
  }

  const geometry = new THREE.BufferGeometry();

  geometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(positions, 3)
  );

  geometry.setAttribute(
    'uv',
    new THREE.Float32BufferAttribute(uvs, 2)
  );

  geometry.setIndex(indices);

  geometry.computeVertexNormals();

  const mesh = new THREE.Mesh(
    geometry,
    material
  );

  const bp = new THREE.Vector3(...bonePivot);

  const cp = c.pivot
    ? new THREE.Vector3(...c.pivot)
    : new THREE.Vector3(
        o[0] + s[0] / 2,
        o[1] + s[1] / 2,
        o[2] + s[2] / 2
      );

  const center = new THREE.Vector3(
    o[0] + s[0] / 2,
    o[1] + s[1] / 2,
    o[2] + s[2] / 2
  );

  const group = new THREE.Group();

  group.position.copy(cp.clone().sub(bp));

  applyRotation(group, c.rotation);

  mesh.position.copy(center.sub(cp));

  group.add(mesh);

  return group;
}

/* モデル構築 */
function buildModel(data, texture) {

  const gd = data['minecraft:geometry']?.[0];

  if (!gd) {
    throw new Error(
      'minecraft:geometry が見つかりません'
    );
  }

  const tw =
    gd.description.texture_width ||
    texture.image.width;

  const th =
    gd.description.texture_height ||
    texture.image.height;

  const material = new THREE.MeshBasicMaterial({
    map: texture,
    transparent: true,
    alphaTest: 0.001,
    side: THREE.DoubleSide
  });

  const root = new THREE.Group();

  const boneMap = new Map();

  /* ボーン作成 */
  for (const bone of gd.bones) {

    const group = new THREE.Group();

    group.name = bone.name;

    group.userData.pivot = new THREE.Vector3(
      ...(bone.pivot || [0, 0, 0])
    );

    applyRotation(group, bone.rotation);

    boneMap.set(bone.name, {
      group,
      bone
    });
  }

  /* 親子関係 */
  for (const bone of gd.bones) {

    const item = boneMap.get(bone.name);

    const group = item.group;
    const pivot = group.userData.pivot;

    if (bone.parent && boneMap.has(bone.parent)) {

      const parent =
        boneMap.get(bone.parent).group;

      group.position.copy(
        pivot.clone().sub(parent.userData.pivot)
      );

      parent.add(group);

    } else {

      group.position.copy(pivot);

      root.add(group);
    }
  }

  /* キューブ追加 */
  let cubeCount = 0;

  for (const bone of gd.bones) {

    const group = boneMap.get(bone.name).group;

    const pivot = group.userData.pivot.toArray();

    for (const cube of bone.cubes || []) {

      group.add(
        makeCube(
          cube,
          tw,
          th,
          pivot,
          material
        )
      );

      cubeCount++;
    }
  }

  root.updateMatrixWorld(true);

  return {
    root,
    bones: gd.bones.length,
    cubes: cubeCount,
    id: gd.description.identifier
  };
}

/* ビューア初期化 */
function setupViewer() {

  const host = $('viewer');

  if (renderer) {
    renderer.dispose();
    host.innerHTML = '';
  }

  scene = new THREE.Scene();

  scene.background = new THREE.Color(0xdce3ea);

  const width = host.clientWidth;
  const height = host.clientHeight;

  camera = new THREE.PerspectiveCamera(
    38,
    width / height,
    0.1,
    10000
  );

  renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: false
  });

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio || 1, 2)
  );

  renderer.setSize(width, height);

  host.appendChild(renderer.domElement);

  controls = new OrbitControls(
    camera,
    renderer.domElement
  );

  controls.enableDamping = true;
  controls.dampingFactor = 0.07;

  scene.add(
    new THREE.HemisphereLight(
      0xffffff,
      0x8b96a5,
      2
    )
  );

  const light = new THREE.DirectionalLight(
    0xffffff,
    1.2
  );

  light.position.set(200, 300, 400);

  scene.add(light);
}

/* カメラ位置調整 */
function fitCamera() {

  modelRoot.updateMatrixWorld(true);

  const box = new THREE.Box3().setFromObject(modelRoot);

  if (box.isEmpty()) {
    throw new Error('モデルの形状がありません');
  }

  const center = box.getCenter(
    new THREE.Vector3()
  );

  const size = box.getSize(
    new THREE.Vector3()
  );

  const max = Math.max(
    size.x,
    size.y,
    size.z
  );

  controls.target.copy(center);

  camera.position.set(
    center.x + max * 0.9,
    center.y + max * 0.45,
    center.z + max * 1.35
  );

  camera.near = Math.max(0.01, max / 1000);
  camera.far = max * 20;

  camera.updateProjectionMatrix();

  controls.update();
}

/* 描画ループ */
function animate() {

  animationId = requestAnimationFrame(animate);

  if (controls) {
    controls.update();
  }

  if (renderer && scene && camera) {
    renderer.render(scene, camera);
  }
}

/* ファイル読み込み */
$('load').addEventListener('click', async () => {

  try {

    const jsonFile = $('json').files[0];
    const pngFile = $('png').files[0];

    if (!jsonFile || !pngFile) {
      throw new Error(
        'JSONとPNGを両方選択してください'
      );
    }

    say('ファイルを読み込み中...');

    const data = JSON.parse(
      await jsonFile.text()
    );

    const bitmap = await createImageBitmap(
      pngFile
    );

    const texture = new THREE.CanvasTexture(
      bitmap
    );

    texture.colorSpace = THREE.SRGBColorSpace;
    texture.flipY = true;

    texture.magFilter = THREE.NearestFilter;
    texture.minFilter = THREE.LinearMipmapLinearFilter;

    texture.generateMipmaps = true;

    const built = buildModel(data, texture);

    if (animationId) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }

    setupViewer();

    modelRoot = built.root;

    scene.add(modelRoot);

    fitCamera();

    animate();

    say(
      `表示中：${built.id} / ボーン ${built.bones} / キューブ ${built.cubes}`
    );

  } catch (error) {

    console.error(error);

    say('エラー：' + error.message);
  }

});

/* 画面サイズ変更 */
window.addEventListener('resize', () => {

  if (!renderer || !camera) return;

  const host = $('viewer');

  camera.aspect =
    host.clientWidth / host.clientHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    host.clientWidth,
    host.clientHeight
  );

});

</script>

</body>
</html>
